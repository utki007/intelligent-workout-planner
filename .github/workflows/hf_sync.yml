name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: utki007/Agentic-Workout-Planner
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is missing. Add it in GitHub repo settings."
            exit 1
          fi

          USERNAME="${HF_SPACE_REPO%%/*}"
          HF_REMOTE_URL="https://${USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"

          git remote remove hf 2>/dev/null || true
          git remote add hf "$HF_REMOTE_URL"

          git push hf HEAD:main
