<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligent Workout Planner</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar sidebar-left">
      <h1 class="app-title">Workout Planner</h1>
      <section class="injuries-section">
        <h2>Current injuries</h2>
        <p id="injuries-list" class="injuries-list">None</p>
      </section>
    </aside>

    <main class="main-panel">
      <section id="chat-log" class="chat-log" aria-live="polite"></section>
      <form id="chat-form" class="composer">
        <textarea
          id="chat-input"
          name="message"
          placeholder="Ask for recommendations, set injuries, or generate a plan..."
          rows="2"
          required
        ></textarea>
        <button id="send-btn" type="submit">Send</button>
      </form>
    </main>

    <aside class="sidebar sidebar-right">
      <h2 class="pydatalog-title">PyDatalog</h2>
      <pre id="pydatalog-output" class="pydatalog-output">No query yet. Send a message to see rule-engine output.</pre>
    </aside>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
